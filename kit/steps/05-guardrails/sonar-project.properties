# Réglages de l'analyse SonarQube de RHPilot.
sonar.projectKey=rhpilot
sonar.projectName=RHPilot
sonar.sources=src,public,db
sonar.tests=test
sonar.javascript.lcov.reportPaths=lcov.info
# Le front et le jeu de données ne sont pas couverts par les tests unitaires : le front relève des tests de bout en bout.
sonar.coverage.exclusions=public/**,db/**
